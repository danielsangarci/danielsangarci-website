# =====================================================================
#  Publicaciones: lo unico que se edita a mano
# =====================================================================
#
# Todo lo que tiene DOI y esta en tu ORCID se importa solo con
# `_publications/actualizar.R` (datos de OpenAlex y Crossref). Lo que solo
# aparece en OpenAlex nunca sale como entrada propia: como mucho, como boton
# "Preprint" o "Data" de uno de tus trabajos.
#
# Este archivo sirve para tres cosas:
#
#   1. `ajustes`: retocar un trabajo importado, usando su DOI como clave.
#      Todos los campos son opcionales.
#
#      Enlaces:
#        pdf:       enlace al PDF (sustituye al que se detecte solo)
#        code:      enlace al codigo (GitHub, Zenodo...)
#        data:      enlace (o lista de enlaces) a los datos; se suma a los
#                   detectados solos. `data: none` quita los detectados.
#        preprint:  enlace al preprint (sustituye al detectado solo).
#                   `preprint: none` quita el detectado.
#
#      Datos que vengan mal de Crossref/OpenAlex:
#        title:     titulo corregido (admite *cursiva* para especies)
#        authors:   lista de autores ["Apellido, I.", ...]
#        venue, volume, issue, pages, year, editors, publisher
#        type:      article | preprint | chapter | book
#        abstract:  resumen, si la revista no lo comparte (p. ej. Elsevier)
#        note:      nota corta que aparece bajo la referencia
#        hide:      true para que no salga en la web
#
#      Solo para un preprint o un dataset (con SU DOI como clave):
#        link_to:   DOI del articulo al que pertenece. Sirve cuando el
#                   articulo se publico con otro titulo y no se emparejan
#                   solos. `link_to: none` impide que se emparejen.
#
#   2. `extra`: trabajos SIN DOI o que no estan en ORCID.
#      Campos: type (article | chapter | preprint | book), year,
#      authors (lista "Apellido, I."), title, venue, volume, issue,
#      pages, editors, publisher, url, pdf. Las especies van en *cursiva*.
#
#   3. `options`: ajustes de la pagina.
#        citations: false para no mostrar el numero de citas (OpenAlex
#                   cuenta menos que Google Scholar).
#
# Tu nombre se pone en negrita automaticamente.
# ---------------------------------------------------------------------

options:
  citations: true

ajustes:
