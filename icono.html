<!-- Icono vectorial para los navegadores que lo admiten: se ve nítido a
     cualquier tamaño. El favicon PNG de _quarto.yml queda como respaldo
     para los que no leen SVG y para los buscadores. -->
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="apple-touch-icon" href="/img/favicon.png">

<!-- Boton "volver arriba": aparece al bajar en las paginas largas -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'volver-arriba';
  b.setAttribute('aria-label', 'Back to top');
  b.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5l-7 7 1.4 1.4L11 8.8V20h2V8.8l4.6 4.6L19 12z" fill="currentColor"/></svg>';
  document.body.appendChild(b);
  var actualizar = function () { b.classList.toggle('is-visible', window.scrollY > window.innerHeight * 0.8); };
  window.addEventListener('scroll', actualizar, { passive: true });
  actualizar();
  b.addEventListener('click', function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });
});
</script>
