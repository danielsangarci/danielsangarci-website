project:
  type: website
  output-dir: docs
  # CNAME conecta GitHub Pages con danielsangarci.com. Sin esta linea, un
  # render completo lo borraba de docs/ y el dominio dejaba de funcionar.
  resources:
    - CNAME
    # CV resumido, que la web no enlaza (lo genera _cv/pdf/render_cv.R).
    # Sin esto, un render completo lo borraria de docs/. Los CV en espanol
    # no se publican.
    - cv-short.pdf
  # Actualiza la lista de publicaciones (ORCID + OpenAlex + Crossref).
  # Consulta internet como mucho una vez al dia; sin conexion usa la copia.
  pre-render: Rscript _publications/actualizar.R

website:
  site-url: https://danielsangarci.com/
  description: "Daniel Sánchez-García, ecologist at the Doñana Biological Station (EBD-CSIC), studying species interactions in ant, microbiome and mycobiome communities."
  title: "Daniel Sánchez-García"
  favicon: img/favicon.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    background: "#DDE5F1"
    foreground: dark
    search: false
    pinned: false
    # La marca va con el nombre corto: el completo no cabe junto a las ocho
    # entradas del menu por debajo de ~1050px y Quarto lo cortaba con puntos
    # suspensivos. El titulo completo sigue en la pestana del navegador.
    logo: img/logo-ant-network.svg
    logo-alt: "Daniel Sánchez-García"
    title: "D. Sánchez-García"
    right:
      - href: index.qmd#about
        text: About me
      - research.qmd  
      - publications.qmd
      - text: CV
        href: cv.qmd
      - posts.qmd
      - gallery.qmd
      - contact.qmd
      - icon: github
        text: Report a Bug
        href: https://github.com/danielsangarci/danielsangarci-website/issues/new
  cookie-consent: true
  reader-mode: false
  google-analytics: "G-H3GD3Z7KWV"
  
  page-footer:
    left: |
      {{< fa regular copyright >}} 2026 Daniel Sánchez-García<br>
      Content licensed under [CC BY-NC-SA 4.0](http://creativecommons.org/licenses/by-nc-sa/4.0/) · Made with [Quarto](https://quarto.org/)
    center:
      - text: Publications
        href: publications.qmd
      - text: CV
        href: cv.qmd
      - text: Contact
        href: contact.qmd
    right:
      # direccion completa: con "contact.qmd" Quarto pone el titulo de la pagina en vez del icono
      - icon: envelope
        href: https://danielsangarci.com/contact.html
        aria-label: Contact
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=5EQSDqwAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: person-badge
        href: https://orcid.org/0000-0002-0710-6292
        aria-label: ORCID
      - icon: github
        href: https://github.com/danielsangarci
        aria-label: GitHub
      - icon: instagram
        href: https://www.instagram.com/danielsangarci_wildlife/
        aria-label: Instagram
  
format:
  html:
    # Un solo tema: la web no tiene modo oscuro (antes habia un boton de
    # cambio de tema que no hacia nada, porque los dos temas eran iguales)
    theme: [cosmo, custom.scss]
    fontsize: 1.2em
    linestretch: 1.7
    css: styles.css
    toc: true
    page-layout: full
    linkcolor: "#234877"
    smooth-scroll: true
    include-in-header: icono.html

editor: visual

