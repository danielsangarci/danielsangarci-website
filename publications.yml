  abstract: A successful reintroduction of <i>Phengaris teleius</i> performed in the
    Netherlands by translocating 86 individuals from a Polish metapopulation in 1990
    represents a unique opportunity to study changes in butterflies from a source
    and reintroduced metapopulation after such a common conservation practice. Using
    multilevel comparisons, we tested morphological and genetic changes that occurred
    after 30 generations since the reintroduction. We also assessed the climatic and
    connectivity changes that occurred over time in both metapopulation networks.
    Unexpectedly, we found more significant morphological changes in the current individuals
    from the source metapopulation, where both sexes had bigger hindwings with different
    shapes in comparison to the individuals from the original metapopulation in the
    year of the reintroduction and the ones from the current reintroduced metapopulation.
    The butterflies from the Dutch metapopulation also had smaller thorax width compared
    to the ones from the current source metapopulation. The observed morphological
    changes can be shaped by various factors like changes in climatic conditions and
    habitat connectivity. Additionally, the genetic analysis revealed a differentiation
    between the source and reintroduced metapopulation. We found a loss of half of
    the allelic richness and a bottleneck effect in the reintroduced metapopulation
    compared to the current Polish one. Our results show that <i>Phengaris</i> butterflies
    have the potential to adapt to new habitats and respond to climatic changes despite
    their complex life cycle. A proper long-term habitat management in reintroduced
    butterfly metapopulations and habitat restoration are key factors influencing
    the success of reintroduction.
