  title: Ongoing coevolution between reintroduced <i>Phengaris teleius</i> butterflies
    and their <i>Myrmica</i> host ants
  url: https://doi.org/10.64898/2025.12.02.691951
  authors: <strong>Sánchez-García, D.</strong>, Wynhoff, I., d’Ettorre, P., Leroy,
    C., Kajzer-Bonk, J., Maák, I. E., Barbero, F., Casacci, L. P., and Witek, M.
  venue: <i>bioRxiv</i>
