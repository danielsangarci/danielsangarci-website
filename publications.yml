  title: 'Uncovering ant diversity across forest successional stages in the Yangambi
    Biosphere Reserve (DRC): Insights from Winkler and pitfall trap sampling'
  url: https://doi.org/10.3897/afrinvertebr.67.180461
  authors: Ambakina, H., Gómez, K., Monzenga, J.-C., <strong>Sánchez-García, D.</strong>,
    and Dekoninck, W.
