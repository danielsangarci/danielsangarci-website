  oa: true
  metrics: true
  abstract: Litter ant communities constitute an important component of biodiversity
    in tropical regions. They are currently used in several ecosystem management programmes
    to assess forest health. The aim of this study was to uncover the ant diversity
    across forest successional stages (fallow land, secondary forest and primary forest)
    in the Yangambi Biosphere Reserve, the Democratic Republic of the Congo. These
    habitats were sampled at six localities using pitfall traps and Winkler extractions.
    In total, 190 ant species belonging to 50 genera and eight subfamilies were recorded
    in the Yangambi Biosphere Reserve. Ant diversity increased significantly along
    the successional gradient, being lowest in fallow land, intermediate in secondary
    forest, and highest in primary forest. Sixty ant species were shared across all
    three habitats, while each habitat supported a distinct assemblage of species.
    Primary forests contained the greatest number of exclusive species, followed by
    secondary forests and fallow land. Winkler extractors captured substantially more
    ant species than pitfall traps, recording nearly 50% greater species richness.
    However, a significant portion of the ant fauna in the Yangambi Biosphere Reserve
    likely remains unrecorded, and additional sampling methods (like arboreal traps,
    net sweeping and baiting) could provide a more complete picture of its biodiversity.
