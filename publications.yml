  title: Temporal and spatial variation of morphological traits and genetic structure
    in <i>Phengaris teleius</i> myrmecophilous butterflies following habitat and climate
    changes three decades after reintroduction
  url: https://doi.org/10.1016/j.gecco.2024.e03104
