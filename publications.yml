  s2_url: https://www.semanticscholar.org/paper/66eaacfb483a7ea8b508c2ebd42b55cc77a08114
  abstract: 'Coevolutionary interactions between parasites and hosts are key drivers
    of biological adaptation. In this study, we explore the evolutionary response
    of the social parasitic butterfly <i>Phengaris teleius</i> to its host ant, <i>Myrmica
    scabrinodis</i>, taking advantage of a unique opportunity: the reintroduction
    of the butterfly in the Netherlands thirty years ago. We compared the degree of
    host mimicry and behavioural performance of caterpillars between the reintroduced
    and the Polish source population. After about thirty generations, chemical and
    vibroacoustical signal profiles have diverged. Chemical mimicry remained limited
    during the pre-adoption phase for both groups; however, in the post-adoption phase,
    the source population showed significantly higher chemical similarity to their
    local hosts. In contrast, reintroduced pre-adoption caterpillars evolved vibroacoustic
    signals closely resembling local hosts, also resulting in a stronger response
    from their local host ants. This suggests that adoption is driven by acoustics
    and subsequently serves as a selective filter promoting post-entry chemical refinement.
    Behavioural data evince that despite the differences between the different communication
    channels, the combination of signals remains sufficient to ensure recognition
    and integration in both host-parasite systems. These results illustrate how social
    parasites involved in multisensory mimicry can rapidly recalibrate strategies
    to remain functional in new ecological contexts.'
