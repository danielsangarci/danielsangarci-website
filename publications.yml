  title: Temperature and management reduce the abundance of the invasive Argentine
    ant (<i>Linepithema humile</i>)
  url: https://doi.org/10.64898/2026.10.08.756264
  authors: <strong>Sánchez-García, D.</strong>, Cerdá, X., and Angulo, E.
  venue: <i>bioRxiv</i>
