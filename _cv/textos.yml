# Textos fijos del PDF en cada idioma: titulos de seccion, frases, etiquetas.
# Para anadir un idioma nuevo, anade su clave (p. ej. fr:) a cada texto.
# {n}, {scholar} y {web} se sustituyen al generar el PDF.

# Titulos de seccion
journey:          {en: My journey,                 es: Mi trayectoria}
