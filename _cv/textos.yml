# Frases
publications_full:  {en: "Also in [*my Google Scholar profile*]({scholar}) and available to download from [*my Website*]({web}).",
                     es: "También en [*mi perfil de Google Scholar*]({scholar}) y disponibles para descargar en [*mi web*]({web})."}
publications_short: {en: "Note: Showing only the {n} most recent publications. For a complete list of peer-reviewed publications and manuscripts, please refer to my [*Google Scholar profile*]({scholar}) or [*personal website*]({web}).",
                     es: "Nota: solo se muestran las {n} publicaciones más recientes. La lista completa de publicaciones y manuscritos está en mi [*perfil de Google Scholar*]({scholar}) o en mi [*web*]({web})."}
conferences_short:  {en: "I have presented my research as oral talks and posters in **{n}** national and international conferences. For a list of presentations, [*click here*]({web}) to download my full cv.",
                     es: "He presentado mi investigación en **{n}** comunicaciones orales y pósteres en congresos nacionales e internacionales. La lista completa está en mi [*CV completo*]({web})."}
reviews_intro:      {en: "Manuscripts reviewed for:", es: "Revisor de manuscritos para:"}
references_request: {en: References available on request., es: Referencias disponibles a petición.}
languages_note:     {en: "Common European Framework of Reference for Languages: A1/A2: Basic User. B1/B2: Independent User. C1/C2: Proficient User",
                     es: "Marco Común Europeo de Referencia para las Lenguas: A1/A2: usuario básico. B1/B2: usuario independiente. C1/C2: usuario competente"}

