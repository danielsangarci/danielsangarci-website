internships:      {en: Internships,                es: Prácticas}
publications:     {en: Publications,               es: Publicaciones}
conferences:      {en: Conference talks and posters, es: Comunicaciones en congresos}
funding:          {en: Funding,                    es: Financiación}
awards:           {en: Awards,                     es: Premios}
organization:     {en: Organization of Conferences and Scientific Events, es: Organización de congresos y eventos científicos}
reviews:          {en: Reviews,                    es: Revisión de artículos}
workshops:        {en: Workshops,                  es: Talleres de trabajo}
courses:          {en: Courses,                    es: Cursos}
memberships:      {en: Memberships,                es: Sociedades científicas}
